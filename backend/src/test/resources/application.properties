# Les tests tournent sur H2 en mode PostgreSQL : pas de base locale, pas de
# Docker, rien a installer sur le poste (ENF7, B6). Les migrations Flyway y sont
# rejouees a l'identique — c'est ce qui garantit que le SQL reste portable et,
# surtout, que les tests s'executent sur le meme schema que la production.
spring.datasource.url=jdbc:h2:mem:kfokam48;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=true
# `locations` n'est pas redefini ici : la valeur par defaut de production ne
# contient que db/migration, et c'est exactement ce que les tests veulent. Ils
# fabriquent leurs propres scenarios et verifient des agregats au chiffre pres —
# dependre d'un jeu de demonstration les rendrait faux des qu'on l'enrichit.
spring.jpa.hibernate.ddl-auto=validate
