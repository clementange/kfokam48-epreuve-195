spring.application.name=presence-relecture

# Aucune requete base en dehors de la couche service (B3) : la session JPA ne
# reste pas ouverte pendant la serialisation de la reponse.
spring.jpa.open-in-view=false

# Le schema est versionne par Flyway (B5). Hibernate ne cree ni ne modifie rien,
# il verifie seulement que les entites correspondent aux tables migrees.
spring.jpa.hibernate.ddl-auto=validate

# Toutes les dates sont stockees et echangees en UTC (cahier des charges §8).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Les erreurs passent par le @RestControllerAdvice, jamais par la page d'erreur
# par defaut de Spring : le contrat impose { code, message } sans exception.
spring.web.resources.add-mappings=false
spring.mvc.problemdetails.enabled=false

# PostgreSQL. Les valeurs par defaut correspondent au service de docker-compose :
# aucune variable d'environnement n'est a definir a la main (ENF10).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kfokam48}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kfokam48}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kfokam48}

# Migrations versionnees et commitees (B5). ddl-auto=update est interdit.
spring.flyway.enabled=true
# Deux emplacements existent, et la separation est volontaire :
#   db/migration  le schema et le referentiel — indispensables au fonctionnement
#   db/demo       l'activite de demonstration — seances, presences, exercices,
#                 relectures. Utile au correcteur (ENF6), nuisible aux tests :
#                 un test qui compte des lignes ne doit pas dependre d'un jeu de
#                 demonstration appele a evoluer.
#
# La valeur par defaut n'inclut donc QUE db/migration. La demonstration est
# activee explicitement au lancement, par SPRING_FLYWAY_LOCATIONS dans
# docker-compose.yml. C'est plus sur que l'inverse : on ne peut pas polluer une
# base par oubli, il faut le demander.
spring.flyway.locations=classpath:db/migration


# Origines autorisees a appeler l'API depuis un navigateur. Le frontend est
# servi sur un autre port que l'API : sans ces en-tetes, le navigateur bloque
# toutes les requetes. Le defaut couvre le lancement standard ; docker-compose
# le redefinit si le port du frontend change.
app.cors.origines=${APP_CORS_ORIGINES:http://localhost:3000}
